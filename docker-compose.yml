# MetaScale development environment.
#
#   docker compose up postgres           # canonical DB only (NORMALIZED dev)
#   docker compose up                    # canonical DB + API
#   docker compose --profile sharding up # + 4 (plus a spare) independent shards
#   docker compose --profile cache -f docker-compose.yml \
#       -f docker-compose.cache.yml up   # + Redis cache (Member 6)
#
# Profiles let members start only what they need. The API adapts via MODE,
# SHARDING_ENABLED and CACHE_ENABLED (see .env.example).

x-pg-env: &pg-env
  POSTGRES_USER: metascale
  POSTGRES_PASSWORD: metascale
  POSTGRES_DB: metascale

x-pg-healthcheck: &pg-healthcheck
  test: ["CMD-SHELL", "pg_isready -U metascale -d metascale"]
  interval: 5s
  timeout: 5s
  retries: 12

services:
  # ------------------------------------------------------------- canonical
  postgres:
    image: postgres:16-alpine
    environment: *pg-env
    ports:
      - "5432:5432"
    volumes:
      - pg_canonical_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck: *pg-healthcheck

  # --------------------------------------------------------------- shards
  postgres-shard-0:
    image: postgres:16-alpine
    profiles: ["sharding"]
    environment: *pg-env
    ports:
      - "5540:5432"
    volumes:
      - pg_shard0_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/shards/shard-0:/docker-entrypoint-initdb.d:ro
    healthcheck: *pg-healthcheck

  postgres-shard-1:
    image: postgres:16-alpine
    profiles: ["sharding"]
    environment: *pg-env
    ports:
      - "5541:5432"
    volumes:
      - pg_shard1_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/shards/shard-1:/docker-entrypoint-initdb.d:ro
    healthcheck: *pg-healthcheck

  postgres-shard-2:
    image: postgres:16-alpine
    profiles: ["sharding"]
    environment: *pg-env
    ports:
      - "5542:5432"
    volumes:
      - pg_shard2_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/shards/shard-2:/docker-entrypoint-initdb.d:ro
    healthcheck: *pg-healthcheck

  postgres-shard-3:
    image: postgres:16-alpine
    profiles: ["sharding"]
    environment: *pg-env
    ports:
      - "5543:5432"
    volumes:
      - pg_shard3_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/shards/shard-3:/docker-entrypoint-initdb.d:ro
    healthcheck: *pg-healthcheck

  # Spare shard used by the live 4 -> 5 rebalancing demo.
  postgres-shard-4:
    image: postgres:16-alpine
    profiles: ["sharding"]
    environment: *pg-env
    ports:
      - "5544:5432"
    volumes:
      - pg_shard4_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/shards/shard-4:/docker-entrypoint-initdb.d:ro
    healthcheck: *pg-healthcheck

  # ------------------------------------------------------------------- API
  api:
    build: .
    environment:
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-true}
      MODE: ${MODE:-NORMALIZED}
      SHARDING_ENABLED: ${SHARDING_ENABLED:-false}
      SHARDING_STRATEGY: ${SHARDING_STRATEGY:-consistent_hash}
      SHARD_COUNT: ${SHARD_COUNT:-4}
      VIRTUAL_NODES_PER_SHARD: ${VIRTUAL_NODES_PER_SHARD:-150}
      DATABASE_URL: postgresql+psycopg://metascale:metascale@postgres:5432/metascale
      SHARD_0_URL: postgresql+psycopg://metascale:metascale@postgres-shard-0:5432/metascale
      SHARD_1_URL: postgresql+psycopg://metascale:metascale@postgres-shard-1:5432/metascale
      SHARD_2_URL: postgresql+psycopg://metascale:metascale@postgres-shard-2:5432/metascale
      SHARD_3_URL: postgresql+psycopg://metascale:metascale@postgres-shard-3:5432/metascale
      SHARD_4_URL: postgresql+psycopg://metascale:metascale@postgres-shard-4:5432/metascale
      # ---- Redis cache (Member 6) ---------------------------------------
      # CACHE_ENABLED defaults to false so the base stack runs with no Redis.
      # The cache override file (docker-compose.cache.yml) flips it to true
      # and orders the API to start after Redis is healthy.
      CACHE_ENABLED: ${CACHE_ENABLED:-false}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CACHE_DEFAULT_TTL: ${CACHE_DEFAULT_TTL:-60}
      CACHE_HOT_KEY_THRESHOLD: ${CACHE_HOT_KEY_THRESHOLD:-5}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import httpx,sys; sys.exit(0 if httpx.get('http://localhost:8000/health', timeout=3).status_code==200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6

  # ============================================== distributed cache (Member 6)
  # Rebuildable, TTL-bound cache-aside over PostgreSQL. Started only with the
  # `cache` profile (see docker-compose.cache.yml for API wiring). The named
  # volume holds AOF/RDB warm-restart data and is disposable: losing it only
  # causes cache misses, never data loss (PostgreSQL is the source of truth).
  redis:
    image: redis:7-alpine
    profiles: ["cache"]
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "6379:6379"
    volumes:
      - ./infrastructure/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_cache_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    profiles: ["messaging"]
    ports:
      - "5672:5672"
      - "15672:15672"

  opensearch:
    image: opensearchproject/opensearch:2.13.0
    profiles: ["search"]
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN_INSTALL: "true"
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms256m -Xmx256m"
    ports:
      - "9200:9200"

  minio:
    image: minio/minio:latest
    profiles: ["storage"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: metascale
      MINIO_ROOT_PASSWORD: metascaleminio
    ports:
      - "9000:9000"
      - "9001:9001"

  prometheus:
    image: prom/prometheus:latest
    profiles: ["observability"]
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"

volumes:
  pg_canonical_data:
  pg_shard0_data:
  pg_shard1_data:
  pg_shard2_data:
  pg_shard3_data:
  pg_shard4_data:
  redis_cache_data:
