# ---------------------------------------------------------------------------
# Redis configuration for MetaScale distributed cache (Member 6)
#
# This file is mounted into the redis container by docker-compose.cache.yml:
#   docker run redis:7-alpine redis-server /usr/local/etc/redis/redis.conf
#
# The cache is REBUILDABLE STATE: every key is a derived post representation
# with a TTL. PostgreSQL remains the source of truth; losing this volume or
# evicting keys only causes cache misses, never data loss.
# ---------------------------------------------------------------------------

# Network
port 6379
bind 0.0.0.0
protected-mode yes
tcp-backlog 511
timeout 300
tcp-keepalive 60

# Eviction: bounded memory, LRU eviction so the cache never OOMs the host.
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence: AOF for fast warm restarts in dev; data is still disposable.
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Snapshots: one periodic RDB as an additional warm-cache aid.
save 900 1
save 300 10
save 60 10000

# Logging / observability
loglevel notice
slowlog-log-slower-than 10000
slowlog-max-len 128
latency-monitor-threshold 100

# Keyspace notifications are not required by the cache layer.
notify-keyspace-events ""
